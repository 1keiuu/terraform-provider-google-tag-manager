name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Signed provider release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # Upload signed release assets.
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.4"
          cache: false
      - uses: ./.github/actions/import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Verify signed release tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git verify-tag "$GITHUB_REF_NAME"
      - uses: ./.github/actions/goreleaser
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
