name: action-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

concurrency:
  group: action-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Action dependencies and reproducible builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - name: Audit dependencies and workflow references
        run: python3 scripts/audit-vendored-actions.py
      - name: Verify token scope, revocation, and GPG cleanup
        run: node --test scripts/action-smoke.test.mjs
      - name: Verify reproducible Action builds
        run: python3 scripts/build-vendored-actions.py --check
