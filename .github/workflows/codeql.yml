name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Upload CodeQL results.
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - uses: ./.github/actions/codeql/init
        with:
          languages: go
      - uses: ./.github/actions/codeql/autobuild
      - uses: ./.github/actions/codeql/analyze
