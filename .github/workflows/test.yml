name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    strategy:
      matrix:
        go-version: ["1.26.11", "1.27.4"]
    runs-on: ubuntu-24.04
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - uses: ./.github/actions/setup-terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...

  generated-docs:
    name: Generated documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.4"
          cache: true
      - uses: ./.github/actions/setup-terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: go generate ./...
      - run: git diff --exit-code -- docs

  goreleaser-check:
    name: GoReleaser configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - uses: ./.github/actions/goreleaser
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check
