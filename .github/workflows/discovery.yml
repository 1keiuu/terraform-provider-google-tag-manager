name: discovery-drift

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-drift
  cancel-in-progress: true

jobs:
  compare:
    name: Compare discovery documents
    runs-on: ubuntu-24.04
    steps:
      - uses: 1keiuu/terraform-provider-google-tag-manager/.github/actions/checkout@ece3837390798c3261f920f94a584ea00393ab39
        with:
          persist-credentials: false
      - run: |
          curl -fsSL 'https://tagmanager.googleapis.com/$discovery/rest?version=v1' -o /tmp/v1.json
          curl -fsSL 'https://tagmanager.googleapis.com/$discovery/rest?version=v2' -o /tmp/v2.json
          cmp internal/discovery/v1.json /tmp/v1.json
          cmp internal/discovery/v2.json /tmp/v2.json
