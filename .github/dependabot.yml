version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /.github/actions/checkout
      - /.github/actions/setup-go
      - /.github/actions/create-github-app-token
      - /.github/actions/import-gpg
      - /.github/actions/codeql
      - /.github/actions/setup-terraform
      - /.github/actions/goreleaser
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vendored-action-dependencies:
        patterns:
          - "*"
